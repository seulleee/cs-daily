# 스키마 변경 → 마이그레이션 SQL 자동 생성 (Prisma 엔진을 받을 수 없는 환경용).
# chore/migration-* 브랜치에 schema.prisma를 바꿔 푸시하면:
#   1) 기존 migrations와 schema.prisma의 차이를 SQL로 생성
#   2) 빈 Postgres에 전체 마이그레이션을 적용해 검증 + 시드
#   3) 생성된 파일을 같은 브랜치에 커밋
# 사용: MIGRATION_NAME 은 브랜치명 접미사 (chore/migration-init → init)
name: prisma-migration

on:
  push:
    branches: ["chore/migration-*"]
    paths: ["apps/api/prisma/schema.prisma", ".github/workflows/prisma-migration.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: csdaily, POSTGRES_PASSWORD: csdaily, POSTGRES_DB: csdaily }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U csdaily" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://csdaily:csdaily@localhost:5432/csdaily?schema=public
      DIRECT_URL: postgresql://csdaily:csdaily@localhost:5432/csdaily?schema=public
      SHADOW_DATABASE_URL: postgresql://csdaily:csdaily@localhost:5432/shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cs-daily/contracts build

      - name: Generate migration SQL
        working-directory: apps/api
        run: |
          NAME="${GITHUB_REF_NAME#chore/migration-}"
          psql "postgresql://csdaily:csdaily@localhost:5432/csdaily" -c "CREATE DATABASE shadow;"
          mkdir -p prisma/migrations
          if [ -z "$(ls -A prisma/migrations | grep -v migration_lock.toml)" ]; then FROM="--from-empty"; else FROM="--from-migrations prisma/migrations --shadow-database-url $SHADOW_DATABASE_URL"; fi
          SQL="$(pnpm exec prisma migrate diff $FROM --to-schema-datamodel prisma/schema.prisma --script)"
          if echo "$SQL" | grep -q "This is an empty migration"; then echo "변경 없음"; exit 0; fi
          DIR="prisma/migrations/$(date -u +%Y%m%d%H%M%S)_${NAME//-/_}"
          mkdir -p "$DIR"
          printf '%s\n' "$SQL" > "$DIR/migration.sql"
          [ -f prisma/migrations/migration_lock.toml ] || printf '# Please do not edit this file manually\n# It should be added in your version-control system (i.e. Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          echo "생성: $DIR"; cat "$DIR/migration.sql" | head -40

      - name: Verify — apply all migrations + seed on empty DB
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma generate
          pnpm prisma:seed
          psql "postgresql://csdaily:csdaily@localhost:5432/csdaily" -c "select (select count(*) from tracks) tracks, (select count(*) from lessons) lessons, (select count(*) from questions) questions;"

      - name: Commit migration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/migrations
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "chore(db): prisma 마이그레이션 생성 (${GITHUB_REF_NAME#chore/migration-})"
          git push
