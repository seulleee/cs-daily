# CI (기획서 11절): lint(boundaries) → typecheck → 도메인 단위 테스트 → 콘텐츠 검증 → 마이그레이션+통합 테스트 → main이면 배포
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: 10.28.0
  NODE_VERSION: 22

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: csdaily, POSTGRES_PASSWORD: csdaily, POSTGRES_DB: csdaily }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U csdaily" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://csdaily:csdaily@localhost:5432/csdaily?schema=public
      DIRECT_URL: postgresql://csdaily:csdaily@localhost:5432/csdaily?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cs-daily/contracts build
      - name: Content validation
        run: pnpm content:validate
      - name: Prisma generate
        run: pnpm --filter @cs-daily/api prisma:generate
      - name: Lint (DDD boundaries)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Domain unit tests
        run: pnpm --filter @cs-daily/api test
      - name: Migrate + seed against CI Postgres
        run: |
          pnpm --filter @cs-daily/api exec prisma migrate deploy
          pnpm --filter @cs-daily/api prisma:seed
      - name: Build
        run: pnpm build
      - name: API E2E (built server + CI Postgres)
        env:
          PORT: 4000
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          JOBS_SECRET: ci-jobs
          API_BASE_URL: http://localhost:4000
          WEB_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:4000/health >/dev/null && break; sleep 1; done
          pnpm --filter @cs-daily/api test:e2e || { cat /tmp/api.log; exit 1; }
      - name: Docker image builds (API)
        run: |
          docker build -f apps/api/Dockerfile -t cs-daily-api:ci .
          # 빌드 산출물의 모듈 그래프가 전부 해석되는지 (배포 후 MODULE_NOT_FOUND 방지)
          docker run --rm -e API_BASE_URL=x -e JWT_ACCESS_SECRET=x cs-daily-api:ci node -e "require('./dist/app.module.js'); console.log('module graph OK')"

  deploy-api:
    # 배포를 잠시 멈추려면 레포 Variables에 DEPLOY_DISABLED=true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_DISABLED != 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation — GCP 키 파일 없이 인증
    # 식별자는 비밀이 아니므로 직접 기재. 비밀 값은 전부 GCP Secret Manager에서 읽는다(GitHub Secrets 미사용)
    env:
      GCP_PROJECT: cs-daily-510823
      REGION: asia-northeast3
      SERVICE: cs-daily-api
      WIF_PROVIDER: projects/541298537642/locations/global/workloadIdentityPools/github/providers/cs-daily-repo
      DEPLOY_SA: cs-daily-deploy@cs-daily-510823.iam.gserviceaccount.com
      # Cloud Run 주소는 서비스명+프로젝트 번호로 결정적이다. 커스텀 도메인을 쓰면 레포 Variables로 덮어쓴다
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://cs-daily-api-541298537642.asia-northeast3.run.app' }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://cs-daily-iota.vercel.app' }}
      MAIL_FROM: ${{ vars.MAIL_FROM || 'CS Daily <onboarding@resend.dev>' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - id: db
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            DATABASE_URL:${{ env.GCP_PROJECT }}/DATABASE_URL
            DIRECT_URL:${{ env.GCP_PROJECT }}/DIRECT_URL
      - name: Build & push image (Artifact Registry)
        run: |
          IMAGE="$REGION-docker.pkg.dev/$GCP_PROJECT/cs-daily/api:${GITHUB_SHA::7}"
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Migrate production DB
        env:
          DATABASE_URL: ${{ steps.db.outputs.DATABASE_URL }}
          DIRECT_URL: ${{ steps.db.outputs.DIRECT_URL }}
        run: |
          pnpm install --frozen-lockfile --filter @cs-daily/api
          pnpm --filter @cs-daily/api exec prisma migrate deploy
      - name: Seed curriculum & questions (idempotent upsert)
        env:
          DATABASE_URL: ${{ steps.db.outputs.DIRECT_URL }}
          DIRECT_URL: ${{ steps.db.outputs.DIRECT_URL }}
        run: |
          pnpm install --frozen-lockfile --filter @cs-daily/api... --filter @cs-daily/content
          pnpm --filter @cs-daily/contracts build
          pnpm --filter @cs-daily/api prisma:generate   # pnpm 10은 postinstall을 돌리지 않으므로 명시적으로 생성
          pnpm --filter @cs-daily/api prisma:seed
      - name: "Deploy to Cloud Run (무료 구간 — 최소 인스턴스 0, 요청 기반 과금)"
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE" --region $REGION --platform managed \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi --concurrency 80 \
            --allow-unauthenticated \
            --service-account "cs-daily-run@$GCP_PROJECT.iam.gserviceaccount.com" \
            --set-env-vars NODE_ENV=production,API_BASE_URL=$API_BASE_URL,WEB_BASE_URL=$WEB_BASE_URL,OAUTH_CALLBACK_BASE_URL=$WEB_BASE_URL,MAIL_FROM="$MAIL_FROM" \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,JOBS_SECRET=JOBS_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do curl -fsS "$API_BASE_URL/health" && exit 0; sleep 5; done; exit 1
  # 웹(Next.js)은 Vercel GitHub 연동이 main 푸시마다 자동 배포하므로 여기서 다루지 않는다.
